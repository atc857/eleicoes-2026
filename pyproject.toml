[project]
name = "boletim-urna"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "atc857", email = "atc857@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asn1tools>=0.169.0",
    "duckdb>=2.0.0",
    "geopandas>=1.2.0",
    "httpx>=0.28.1",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "shapely>=2.2.0",
    "streamlit>=1.66.1",
    "typer>=0.27.3",
]

[project.scripts]
boletim-urna = "boletim_urna:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
